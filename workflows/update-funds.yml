name: Twice daily funds, RUSFAR and placements update

on:
  workflow_dispatch:
  schedule:
    # Ежедневно в 12:40 и 16:00 МСК (09:40 и 13:00 UTC).
    - cron: "40 9 * * *"
    - cron: "0 13 * * *"
    
permissions:
  contents: write

concurrency:
  group: funds-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Trust official Russian CA for T-Bank
        run: bash scripts/setup-tbank-ca.sh

      - name: Update funds and market rates
        run: node scripts/update-data.mjs

      - name: Install DCM browser fallback
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Read placement cards from page data
        id: dcm
        continue-on-error: true
        run: node scripts/update-dcm.mjs

      - name: Save DCM diagnostics
        if: steps.dcm.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dcm-debug
          path: |
            dcm-debug.html
            dcm-debug.png
            dcm-debug-error.txt
          if-no-files-found: warn

      - name: Commit changed data
        run: |
          if git diff --quiet -- funds.json market-rates.json dcm.json; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "funds-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funds.json market-rates.json dcm.json
          git commit -m "Daily funds, RUSFAR and placements update"
          git push

      - name: Report DCM error
        if: steps.dcm.outcome == 'failure'
        run: |
          echo "DCM collection failed. Previous placement data preserved; download dcm-debug."
          exit 1
