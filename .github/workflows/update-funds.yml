name: Daily funds, RUSFAR and placements update

on:
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * *"
      timezone: "Europe/Moscow"
    
permissions:
  contents: write

concurrency:
  group: funds-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Trust official Russian CA for T-Bank
        run: bash scripts/setup-tbank-ca.sh

      - name: Update funds and market rates
        run: node scripts/update-data.mjs

      - name: Install DCM browser fallback
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Read placement cards from page data
        id: dcm
        continue-on-error: true
        run: node scripts/update-dcm.mjs

      - name: Save DCM diagnostics
        if: steps.dcm.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dcm-debug
          path: |
            dcm-debug.html
            dcm-debug.png
            dcm-debug-error.txt
          if-no-files-found: warn

      - name: Commit changed data
        id: commit_data
        run: |
          if git diff --quiet -- funds.json market-rates.json dcm.json; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "funds-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funds.json market-rates.json dcm.json
          git commit -m "Daily funds, RUSFAR and placements update"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Netlify production deploy
        if: steps.commit_data.outputs.changed == 'true'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::Repository secret NETLIFY_BUILD_HOOK is missing."
            exit 1
          fi
          case "$NETLIFY_BUILD_HOOK" in
            https://api.netlify.com/build_hooks/*) ;;
            *)
              echo "::error::NETLIFY_BUILD_HOOK must be a Netlify build hook URL."
              exit 1
              ;;
          esac
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 45 \
            --request POST --header 'Content-Type: application/json' \
            --data '{}' \
            --output "$RUNNER_TEMP/netlify-deploy-response.json" \
            "$NETLIFY_BUILD_HOOK"
          echo "Netlify accepted the deployment request. Check Deploys for the final Published status."

      - name: Report DCM error
        if: steps.dcm.outcome == 'failure'
        run: |
          echo "DCM collection failed. Previous placement data preserved; download dcm-debug."
          exit 1
