name: Weekly fund data update

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1'
      timezone: 'Europe/Moscow'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update funds.json from MOEX ISS
        run: node scripts/update-funds.mjs

      - name: Commit changed data
        run: |
          if git diff --quiet -- funds.json; then
            echo "No fund data changes"
            exit 0
          fi
          git config user.name "funds-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funds.json
          git commit -m "Weekly fund data update"
          git push
