name: Daily funds and RUSFAR update

on:
  workflow_dispatch:
  schedule:
    # Основной запуск — 13:17 МСК
    - cron: "17 10 * * 1-5"

    # Резервный запуск — 14:07 МСК
    - cron: "07 11 * * 1-5"
    
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update funds and market rates
        run: node scripts/update-data.mjs

      - name: Install browser for T-Investments placements
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Update current bond placements
        id: dcm
        continue-on-error: true
        run: node scripts/update-dcm.mjs

      - name: Save DCM diagnostics
        if: steps.dcm.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dcm-debug
          path: |
            dcm-debug.html
            dcm-debug.png
          if-no-files-found: warn

      - name: Commit changed data
        run: |
          if git diff --quiet; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "funds-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funds.json market-rates.json dcm.json
          git commit -m "Daily funds, RUSFAR and DCM update"
          git push

      - name: Report DCM failure
        if: steps.dcm.outcome == 'failure'
        run: |
          echo "T-Investments placements were not parsed. Download the dcm-debug artifact."
          exit 1
