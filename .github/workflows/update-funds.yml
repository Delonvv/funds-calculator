name: Daily funds and RUSFAR update

on:
  workflow_dispatch:
  schedule:
    # Основной запуск — 13:17 МСК
    - cron: "17 10 * * 1-5"

    # Резервный запуск — 14:07 МСК
    - cron: "07 11 * * 1-5"
    
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update funds and market rates
        run: node scripts/update-data.mjs

      - name: Commit changed data
        run: |
          if git diff --quiet; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "funds-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add funds.json market-rates.json
          git commit -m "Daily funds and RUSFAR update"
          git push
